[project]
name = "repomind-worker"
version = "0.1.0"
description = "Background task worker for RepoMind AI Codebase Intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = []
