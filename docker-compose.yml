services:
  postgres:
    image: postgres:16-alpine
    container_name: repomind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repomind_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repomind_password}
      POSTGRES_DB: ${POSTGRES_DB:-repomind_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repomind_user} -d ${POSTGRES_DB:-repomind_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: repomind-backend
    restart: unless-stopped
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-RepoMind Backend}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-repomind_user}:${POSTGRES_PASSWORD:-repomind_password}@postgres:5432/${POSTGRES_DB:-repomind_db}
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: repomind-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-repomind_user}:${POSTGRES_PASSWORD:-repomind_password}@postgres:5432/${POSTGRES_DB:-repomind_db}
      - WORKER_POLL_INTERVAL=${WORKER_POLL_INTERVAL:-5}
      - WORKER_LOG_LEVEL=${WORKER_LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: repomind-frontend
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
